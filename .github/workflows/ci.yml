name: CI (retroalimentación)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      - name: Build de verificación (next build con secretos canario)
        run: npm run build:probe

      - name: Secretos fuera del navegador
        run: npm run test:security

      - name: Aviso sobre la nota
        if: always()
        run: |
          {
            echo "### Resultado de la CI"
            echo ""
            echo "Este resultado es retroalimentación. La nota oficial la calcula el calificador del curso:"
            echo "incluye tests ocultos del reto, mutantes para tus tests propios, revisión del"
            echo "despliegue en Vercel y verificación de integridad (tests oficiales y workflows sin modificar)."
          } >> "$GITHUB_STEP_SUMMARY"
