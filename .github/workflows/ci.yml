name: CI (retroalimentación)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias exactas (package-lock.json)
        run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      - name: Build de verificación (next build con secretos canario)
        run: npm run build:probe

      - name: Secretos fuera del navegador
        run: npm run test:security

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Resultado de la CI"
            echo ""
            echo "Este resultado es retroalimentación sobre tu trabajo. Los tests públicos del reto"
            echo "son una muestra: el contrato completo del README tiene más casos borde y otros datos."
            echo "Revisa también tu despliegue en Vercel y no modifiques los tests oficiales ni los workflows."
          } >> "$GITHUB_STEP_SUMMARY"
